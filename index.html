<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Generate, adjust, and export color palettes. A small color tool by Danny."
        />
        <meta property="og:title" content="Palettes" />
        <meta property="og:description" content="Generate, adjust, and export color palettes." />
        <meta property="og:url" content="https://palettes.danncd.com" />
        <meta property="og:type" content="website" />
        <title>Palettes — Color palette generator</title>
        <script>
            try {
                const theme = localStorage.getItem("palettes-theme");
                if (theme === "light" || theme === "dark") {
                    document.documentElement.dataset.theme = theme;
                }
            } catch {
                // Use the system theme when storage is unavailable.
            }
        </script>
        <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
        <link rel="icon" href="/favicon.png?v=2" type="image/png" sizes="32x32" />
        <script defer src="/vendor/ntc.js"></script>
        <script defer src="/vendor/html2canvas.js"></script>
        <script type="module" src="/src/main.ts"></script>
    </head>
    <body>
        <div class="app">
            <header class="header">
                <div class="header-title">
                    <h1><i data-lucide="swatch-book" aria-hidden="true"></i> Palettes</h1>
                    <button
                        id="theme-toggle"
                        class="icon-button"
                        type="button"
                        aria-label="Switch color theme"
                    ></button>
                </div>
            </header>
            <main class="workspace" aria-label="Palette generator">
                <div id="palette" class="palette" aria-label="Colors"></div>
                <div class="bottom-controls">
                    <div
                        id="toolbar"
                        class="toolbar"
                        role="group"
                        aria-label="Palette controls"
                    ></div>
                    <section id="editor" class="editor" aria-label="Color editor" hidden></section>
                </div>
                <p id="status" class="status" role="status" aria-live="polite"></p>
            </main>
        </div>
        <noscript>Enable JavaScript to generate and edit palettes.</noscript>
    </body>
</html>
